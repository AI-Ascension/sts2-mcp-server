policy_version = 1

[project]
 required_files = [".gitignore", ".editorconfig", ".gitattributes", "AGENTS.md", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "RELEASING.md", "CHANGELOG.md", "LICENSE", "README.md", "SECURITY.md", "THIRD_PARTY_NOTICES.md", "Cargo.lock", "Cargo.toml", "clippy.toml", "Directory.Build.props", "rust-toolchain.toml", "rustfmt.toml", "docs/ARCHITECTURE.md", "docs/CODING_STANDARDS.md", "docs/TESTING.md", "docs/COMPATIBILITY.md", "docs/LICENSING.md", "docs/WORKFLOWS.md", "docs/POLICY_AS_CODE.md", "docs/PRODUCT.md", "docs/REPOSITORY_LAYOUT.md", "docs/decisions/0001-mcp-adapter-boundary-and-ownership.md", "docs/decisions/0002-shared-protocol-sixth-target.md", "docs/decisions/0003-rust-only-foundation-tooling.md", "docs/decisions/0004-non-destructive-foundation-preparation.md", "docs/decisions/0005-wave2-local-mcp-seam.md", "tools/repo-policy/Cargo.toml", "tools/repo-policy/src/config.rs", "tools/repo-policy/src/diagnostic.rs", "tools/repo-policy/src/files.rs", "tools/repo-policy/src/license.rs", "tools/repo-policy/src/lib.rs", "tools/repo-policy/src/main.rs", "tools/repo-policy/src/markdown.rs", "tools/repo-policy/src/rust.rs", "tools/repo-policy/src/workflow.rs", ".github/workflows/ci.yml", ".github/workflows/policy.yml", ".github/dependabot.yml", ".github/pull_request_template.md", "crates/mcp-server/src/catalog_runtime_v3_gameplay.rs", "crates/mcp-server/src/mapping_runtime_v3_gameplay.rs", "crates/mcp-server/src/mapping_runtime_v3_gameplay_context.rs", "crates/mcp-server/src/mapping_runtime_v3_gameplay_envelope.rs", "crates/mcp-server/src/projection_runtime_v3_gameplay.rs", "crates/mcp-server/src/projection_runtime_v3_gameplay_action_shape.rs", "crates/mcp-server/src/projection_runtime_v3_gameplay_shape.rs", "crates/mcp-server/src/protocol_artifact_runtime_v3_gameplay.rs", "crates/mcp-server/tests/runtime_v3_gameplay_mapping.rs", "crates/mcp-server/tests/runtime_v3_exo_tools.rs"]
ignored_directories = [".git", ".idea", ".vscode", "bin", "node_modules", "obj", "target", "vendor"]
ignored_path_prefixes = []

[limits]
rust_production_preferred = 300
rust_production_max = 400
rust_test_preferred = 400
rust_test_max = 600
csharp_production_preferred = 250
csharp_production_max = 350
csharp_test_preferred = 350
csharp_test_max = 500
workflow_preferred = 160
workflow_max = 200
markdown_preferred = 500
markdown_max = 700

[exemptions]
"crates/mcp-server/src/bin/runtime_support/mod.rs" = "Existing runtime support executable boundary remains one composition unit; split with its next transport revision."
