name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Foundation quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact Runtime-v3 and co-op semantic surfaces
        run: |
          git diff --check
          for tool in sts2.observe sts2.legal_actions sts2.dispatch_action sts2.wait_for_transition sts2.reobserve sts2.recover; do
            rg -q "$tool" crates/mcp-server/src/catalog_runtime_v3_gameplay.rs
          done
          rg -q 'sts2.coop_synchronization' crates/mcp-server/src/catalog_coop_gameplay.rs
          if rg -n 'shell|raw_memory|host_object|process_command' crates/mcp-server/src/catalog_runtime_v3_gameplay.rs; then exit 1; fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check repository metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Verify copied POC artifact checksums
        working-directory: protocol-artifact/poc-v1
        run: |
          for path in schema.json manifest.json \
            golden/state-request.json golden/state-response.json \
            golden/action-request.json golden/action-accepted.json \
            golden/action-rejected.json fixtures/invalid-action.json; do
            test -f "$path"
          done
          sha256sum --check SHA256SUMS

      - name: Verify frozen runtime artifact inventories
        run: |
          for profile in runtime-v1 runtime-v2; do
            (cd "protocol-artifact/$profile" && sha256sum --check SHA256SUMS)
          done

      - name: Validate copied POC schema and fixtures
        run: cargo test --locked --package sts2-mcp-server --test artifact

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Enforce repository policy
        run: cargo run --locked --package repo-policy -- --strict
